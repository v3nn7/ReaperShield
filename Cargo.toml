[workspace]
resolver = "2"
members = [
    "crates/analyzer",
    "crates/pe-engine",
    "crates/crypto",
    "crates/packer",
    "crates/obfuscation",
    "crates/hardening",
    "crates/telemetry",
    "crates/visualization",
    "crates/reports",
    "crates/evasion",
    "cli",
    "sdk",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
goblin = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
pbkdf2 = "0.12"
sha2 = "0.10"
lzma-rs = "0.3"
zstd = "0.13"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
