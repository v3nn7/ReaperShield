[package]
name = "reapershield-cli"
version = "0.1.0"
edition = "2021"
authors = ["ReaperShield Team"]
description = "ReaperShield Enterprise Executable Protection Platform (CLI + GUI)"

[[bin]]
name = "reapershield"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tauri = { version = "1.5", features = ["api-all", "custom-protocol"] }
rfd = "0.14"
hex = "0.4"
reapershield-pe-engine = { path = "../crates/pe-engine" }
reapershield-sdk = { path = "../sdk" }
reapershield-analyzer = { path = "../crates/analyzer" }
reapershield-crypto = { path = "../crates/crypto" }
reapershield-packer = { path = "../crates/packer" }
reapershield-obfuscation = { path = "../crates/obfuscation" }
reapershield-hardening = { path = "../crates/hardening" }
reapershield-telemetry = { path = "../crates/telemetry" }
reapershield-reports = { path = "../crates/reports" }
reapershield-visualization = { path = "../crates/visualization" }
reapershield-evasion = { path = "../crates/evasion" }
