[package]
name = "reapershield-crypto"
version = "0.1.0"
edition = "2021"
authors = ["ReaperShield Team"]
description = "Secure Crypter Engine for ReaperShield executable protection platform"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true, features = ["std"] }
rand = { workspace = true }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
subtle = "2.6"
